name: 'YouTrack Autolink'
description: 'Automatically links YouTrack issue IDs (e.g. YT-123) in pull request titles and descriptions.'
branding:
  icon: 'link'
  color: 'blue'

inputs:
  youtrack-url:
    description: 'Base URL of your YouTrack instance, e.g. https://example.youtrack.cloud'
    required: true
  youtrack-project:
    description: 'YouTrack project prefix, e.g. YT'
    required: true

permissions:
  pull-requests: write

runs:
  using: 'composite'
  steps:
    - name: Autolink YouTrack issue IDs
      uses: actions/github-script@v7
      env:
        YOUTRACK_URL: ${{ inputs.youtrack-url }}
        YOUTRACK_PROJECT: ${{ inputs.youtrack-project }}
      with:
        script: |
          const base = process.env.YOUTRACK_URL.replace(/\/+$/, '');
          const prefix = process.env.YOUTRACK_PROJECT.toUpperCase() + '-';
          // Match YT-123 but not when it is already inside a markdown link [YT-123](...)
          const re = new RegExp(`(?<!\\[)\\b(${prefix}\\d+)\\b`, 'gi');

          const link = (text) =>
            text ? text.replace(re, (m, id) => `[${id}](${base}/issue/${id.toUpperCase()})`) : text;

          const pr = context.payload.pull_request;
          const newTitle = link(pr.title);
          const newBody = link(pr.body || '');

          if (newTitle === pr.title && newBody === (pr.body || '')) {
            core.info('No YouTrack issue IDs found, nothing to do.');
            return;
          }

          await github.rest.pulls.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            pull_number: pr.number,
            title: newTitle,
            body: newBody,
          });
          core.info(`Autolinked YouTrack issues in PR #${pr.number}.`);